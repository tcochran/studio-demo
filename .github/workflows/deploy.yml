name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: pnpm run build

      # keep_files preserves the pr-N preview dirs that preview.yml publishes
      # alongside the production site on gh-pages.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build
          keep_files: true

  # studio.ai "shipped" signal. Record a `production` deployment + success status
  # for the built commit so the studio.ai webhook (idea #185, M1) can match
  # deployment.sha → task and move it done→shipped.
  mark-production:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Record production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PROD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          ID=$(printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[]}' "$SHA" \
            | gh api "repos/$REPO/deployments" --method POST --input - --jq '.id')
          gh api "repos/$REPO/deployments/$ID/statuses" --method POST \
            -f state=success -f environment=production -f environment_url="$PROD_URL"
